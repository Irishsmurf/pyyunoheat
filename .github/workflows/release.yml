name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write  # required for OIDC trusted publishing

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: pip install hatch

      - name: Build distribution
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no API token required.
        # One-time setup required:
        #   1. Create PyPI project "pyyunoheat"
        #   2. PyPI project → Publishing → add Trusted Publisher:
        #      owner=paddez, repo=pyyunoheat, workflow=release.yml
        #   3. GitHub → Settings → Environments → create "pypi"
