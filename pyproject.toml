[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyyunoheat"
version = "0.1.0"
description = "Async Python client for the Yuno Energy Heat API (Tridens Monetization)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["yuno", "energy", "heat", "kaizen", "tridens", "smart-home"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "python-dotenv>=1.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["yunoheat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:homeassistant"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
